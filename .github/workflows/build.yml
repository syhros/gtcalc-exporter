name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (creates tag v<version> on this commit)
        type: boolean
        default: false
      version:
        description: Release version, e.g. 1.0.0 (only with "release")
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Set the version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$V" ]; then echo "VERSION=$V" >> "$GITHUB_ENV"; fi

      - name: Build
        run: |
          ./gradlew --stacktrace setupCIWorkspace 2>&1 | tee build.log
          # GTNH's formatter (Spotless) would fail the build on style; apply it instead.
          ./gradlew --stacktrace spotlessApply build 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error:|FAILED|What went wrong" -A3 build.log | head -200 || true

      - name: Check the jar
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-dev.jar' | grep -v -- '-sources.jar' | grep -v -- '-api.jar' | head -1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          unzip -l "$JAR"
          unzip -p "$JAR" mcmod.info
          # Release jars use SRG names; MCP names would crash outside the dev environment.
          if unzip -p "$JAR" com/syhros/packextract/export/IconRenderer.class | grep -a -q "renderItemAndEffectIntoGUI"; then
            echo "::error::jar is not reobfuscated"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pack-extract-jar
          path: ${{ env.JAR }}

  export:
    name: Export test (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [vanilla, gregtech]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb mesa-utils x11-xserver-utils
          pip install --quiet pillow

      - name: Configure an automatic export
        run: |
          OUT="$GITHUB_WORKSPACE/export-out"
          mkdir -p "$OUT"
          for d in run/client/config run/config; do
            mkdir -p "$d"
            printf 'automation {\n    B:exportOnMainMenu=true\n    B:quitAfterMainMenuExport=true\n}\n\nexport {\n    S:outputDir=%s\n    S:packName=ci-%s\n}\n' "$OUT" "${{ matrix.profile }}" > "$d/packextract.cfg"
          done
          cat run/client/config/packextract.cfg

      - name: Run the client and export
        env:
          PACKEXTRACT_AUTO: '1'
          PACKEXTRACT_QUIT: '1'
          PACKEXTRACT_OUT: ${{ github.workspace }}/export-out
        run: |
          EXTRA=""
          if [ "${{ matrix.profile }}" = "gregtech" ]; then EXTRA="-PdevGregTech=true"; fi
          ./gradlew --stacktrace $EXTRA setupCIWorkspace
          ./gradlew --stacktrace $EXTRA spotlessApply
          set +e
          timeout 3000 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew --stacktrace $EXTRA runClient 2>&1 | tee client.log
          echo "client exited with ${PIPESTATUS[0]}"
          set -e
          grep -E "Pack Extract|packextract|Export" client.log | tail -60 || true

      - name: Check the export
        run: python3 .github/scripts/check_export.py export-out ${{ matrix.profile }} contact-sheet-${{ matrix.profile }}.png

      - name: Show problems
        if: always()
        run: |
          for f in export-out/*/errors.log; do echo "== $f"; head -c 20000 "$f"; done || true
          grep -E "ERROR|Exception" client.log | grep -v "^\s*at " | head -80 || true

      - name: Publish the contact sheet to the ci-screenshots branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          [ -f contact-sheet-${{ matrix.profile }}.png ] || exit 0
          mkdir -p /tmp/shots && cp contact-sheet-${{ matrix.profile }}.png* /tmp/shots/
          cp export-out/*/manifest.json /tmp/shots/manifest-${{ matrix.profile }}.json || true
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Export test ${{ matrix.profile }} for ${GITHUB_SHA}"
          for i in 1 2 3; do
            git fetch -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-screenshots 2>/dev/null && git rebase -q FETCH_HEAD 2>/dev/null || true
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" HEAD:ci-screenshots-${{ matrix.profile }} && break
            sleep 3
          done

      - name: Upload the export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ matrix.profile }}
          path: |
            export-out/
            client.log
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, export]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pack-extract-jar
          path: jars
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$V" ] || [ "$V" = "${GITHUB_REF_NAME}" ]; then echo "::error::no version given"; exit 1; fi
          JAR=$(ls jars/*.jar | head -1)
          gh release create "v$V" "$JAR" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Pack Extract $V (Minecraft 1.7.10)" --notes-file .github/RELEASE_NOTES.md
