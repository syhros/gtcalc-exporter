modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/syhros/gtcalc-exporter/issues"

[[mods]]
modId = "packextract"
version = "${version}"
displayName = "Pack Extract"
displayURL = "https://github.com/syhros/gtcalc-exporter"
authors = "syhros"
description = '''
Exports every item, fluid, image, tag and recipe of a modpack (including GregTech CEu recipes) as JSON for gtcalc.app.
Client-side only. Type /packextract in a world.
'''
# Client-only: servers do not need it, and it never blocks joining one.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.packextract]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.packextract]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "CLIENT"
